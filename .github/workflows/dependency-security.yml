name: Validate dependency security
on: [pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh dependency lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm install --global yarn@1.22.22
          yarn import || yarn install --ignore-scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-lockfiles
          path: |
            package.json
            package-lock.json
            yarn.lock
      - run: npm ci
      - run: npm audit
      - run: npx gulp js sass fonts imagemin
